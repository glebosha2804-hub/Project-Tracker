server:
  port: 8083      # твой текущий порт

spring:
  h2:
    console:
      enabled: true
      path: /h2-console   # адрес консоли
  datasource:
    url: jdbc:h2:mem:tracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
